<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>SignalHaven — Offline</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				background: #fafafc;
				color: #111827;
				padding: 1rem;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #090c14;
					color: #f8fafc;
				}
			}
			main {
				max-width: 28rem;
				text-align: center;
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.5rem;
			}
			p {
				margin: 0;
				opacity: 0.8;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You're offline</h1>
			<p>
				SignalHaven can't reach the network right now. Check your connection and
				try again.
			</p>
		</main>
	</body>
</html>
