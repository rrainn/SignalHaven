# SignalHaven example docker compose stack.
#
# Copy `.env.example` to `.env` (and edit the credentials) before running:
#
#   docker compose up -d
#
# The `signalhaven` service waits for `postgres` to become healthy before starting
# and then connects with the same PG* variables the backend supports directly. To
# use external Postgres, remove the `postgres` service and `depends_on` block and
# update the signalhaven service's PG* values for that database.

services:
  signalhaven:
    image: ${SIGNALHAVEN_IMAGE:-ghcr.io/rrainn/signalhaven:latest}
    # Uncomment to build the image locally instead of pulling a published one:
    # build:
    #   context: .
    container_name: signalhaven
    # NVIDIA hosts can enable NVENC by uncommenting this device reservation
    # and the NVIDIA environment variables below.
    # gpus: all
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      SIGNALHAVEN_COMSKIP_PATH: ${SIGNALHAVEN_COMSKIP_PATH:-/usr/bin/comskip}
      SIGNALHAVEN_EXTERNAL_IP_LOOKUP_ENABLED: ${SIGNALHAVEN_EXTERNAL_IP_LOOKUP_ENABLED:-false}
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: video,compute,utility
    # Keep plaintext HTTP host-local so LAN clients must use the HTTPS proxy.
    ports:
      - "127.0.0.1:${SIGNALHAVEN_HTTP_PORT:-3000}:3000"
    volumes:
      - signalhaven-recordings:/var/lib/signalhaven/recordings
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional Linux-only DNS-SD advertiser. Host networking is required so
  # multicast packets and advertised addresses belong to the physical host.
  signalhaven-bonjour:
    image: ${SIGNALHAVEN_BONJOUR_IMAGE:-ghcr.io/rrainn/signalhaven-bonjour:latest}
    container_name: signalhaven-bonjour
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # The sidecar fails clearly at startup when this required value is empty.
      PUBLIC_URL: ${PUBLIC_URL:-}
      SIGNALHAVEN_SERVICE_NAME: ${SIGNALHAVEN_SERVICE_NAME:-SignalHaven}
      SIGNALHAVEN_SERVER_ID: ${SIGNALHAVEN_SERVER_ID:-}
      SIGNALHAVEN_BONJOUR_INTERFACES: ${SIGNALHAVEN_BONJOUR_INTERFACES:-}
      SIGNALHAVEN_BONJOUR_DISABLE_IPV6: ${SIGNALHAVEN_BONJOUR_DISABLE_IPV6:-false}
    volumes:
      - signalhaven-bonjour:/var/lib/signalhaven-bonjour
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      signalhaven:
        condition: service_healthy
    profiles:
      - bonjour

  postgres:
    image: postgres:16-alpine
    container_name: signalhaven-postgres
    restart: unless-stopped
    environment:
      # The image requires POSTGRES_* even though the shared .env uses libpq names.
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    # Local administration remains possible without publishing Postgres to the LAN.
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - signalhaven-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signalhaven-pgdata:
  signalhaven-recordings:
  signalhaven-bonjour:
