# Define this map once in nginx's http context so ordinary and upgraded requests
# use the correct Connection header.
map $http_upgrade $signalhaven_connection {
	default upgrade;
	'' close;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name signalhaven.example.com;

	# Replace these paths with the certificate and key for PUBLIC_URL's host.
	ssl_certificate /etc/nginx/tls/signalhaven.crt;
	ssl_certificate_key /etc/nginx/tls/signalhaven.key;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;

		# Preserve canonical request context and long-lived connection semantics.
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $signalhaven_connection;
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_read_timeout 1h;
	}
}
